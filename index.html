#schoolwear-poc button,#schoolwear-poc select,#schoolwear-poc input{font:inherit;color:inherit}
#schoolwear-poc button{cursor:pointer}

#schoolwear-poc h1,#schoolwear-poc h2,#schoolwear-poc h3,#schoolwear-poc p{margin:0}

    function selectMarkup(name,value,options,kind,disabled = false,swatch = false) {

        </select>${icon('down')}

    function uniformRows() {
      return finderTypes(draft.gender).map(type => {
        const selected = Object.hasOwn(draft.rules,type);

        if (selectedColours.length > 1) options.unshift(['multiple',selectedColours.length + ' colours selected']);
        const colourValue = selectedColours.length > 1 ? 'multiple' : selectedColours[0] || '';
        return `<div class="uniform-row">
          <label class="check-label type-body"><input type="checkbox" data-field="rule-${type}" ${selected ? 'checked' : ''}>${labels[type]}</label>

    function choices(items, action, active, css = '') {

    const fieldset = (label,html,step = '') => `<fieldset><legend class="type-heading">${step ? `<span class="step type-caption">${step} / 3</span>` : ''}${label}</legend>${html}</fieldset>`;

      return `<label class="facet-option type-body">

    function colourOptions() {
      const options = Object.keys(colours).sort();

      ).join('');
      if (!inGroup(draft)) return flat();
      const rows = Object.entries(draft.rules).map(([type,selected]) =>
        `<fieldset class="facet-group"><legend class="type-heading">${labels[type]}</legend>
          ${availableColours(type,draft.gender).sort().map(colour => facetOption('colour',colour,colour,selected.includes(colour),{
            group:type,swatch:true,count:matches({...draft,category:type,rules:{[type]:[colour]}}).length
          })).join('')}

      ).join('');
      const acrossCategories = draft.colours.length
        ? `<fieldset class="facet-group"><legend class="type-heading">All categories</legend>${flat()}</fieldset>` : '';
      return acrossCategories + '<p class="facet-help type-caption">Colours apply to each category below.</p>' + rows;

    function facetOptions() {
      switch (activeFacet) {
        case 'colour':
          return colourOptions();
        case 'category':
          return categories.filter(type => availableColours(type,draft.gender).length).map(type =>
            facetOption('category',type,labels[type],Object.hasOwn(draft.rules,type) || draft.category === type,{
              count:matches({...draft,category:null,rules:{[type]:draft.rules[type] || []}}).length
            })
          ).join('');
        case 'age':
          return ages.map(age => facetOption('age',age,age + ' yrs',draft.age === age,{radio:true})).join('');
        case 'gender':
          return ['Boys','Girls'].map(gender => facetOption('gender',gender,gender,draft.genderSet && draft.gender === gender,{radio:true})).join('');
        case 'price':
          return [10,15,25,40,60].map(price => facetOption('price',price,'Up to £' + price,draft.price === price,{radio:true})).join('');
        case 'pack':
          return facetOption('pack','true','Multipacks only',draft.pack);
        case 'newIn':
          return facetOption('newIn','true','New In',draft.newIn,{count:matches({...draft,newIn:true}).length});
        case 'personalised':
          return '<p class="facet-help type-body">No personalised options in this sample.</p>';
        default: {
          const options = {fit:Object.values(metadata.fits),brand:['Next','Nike'],benefit:Object.values(metadata.benefits)};
          return [...new Set(options[activeFacet])].sort().map(value =>
            facetOption(activeFacet,value,value,draft[activeFacet].includes(value))
          ).join('');
        }
      }
    }
    function drawFilter() {
      const counts = facetCounts(draft);
      const clearable = Object.values(counts).some(Boolean);
      const id = 'filter-' + placement;
      body.innerHTML = `
        <div class="filter-frame">
          <div class="filter-top">
            <p class="type-caption" ${draft.active ? '' : 'hidden'}>Quickshop choices are selected below.</p>
            <button type="button" class="text-btn type-body" data-action="clear-filter-all" ${clearable ? '' : 'disabled'}>Clear all</button>
          </div>
          <div class="facet-layout">
            <div class="facet-rail" role="tablist" aria-label="Product filters" aria-orientation="vertical">
              ${facetKeys.map(key => `<button type="button" role="tab" class="facet-tab type-body"
                id="${id}-${key}" aria-controls="${id}-panel" aria-selected="${pressed(activeFacet === key)}"
                tabindex="${activeFacet === key ? '0' : '-1'}" data-action="facet" data-value="${key}">
                <span>${facetLabels[key]}</span>
                ${counts[key] ? `<span class="facet-badge">${counts[key]}</span>` : ''}
              </button>`).join('')}
            </div>
            <section class="facet-panel" role="tabpanel" id="${id}-panel" aria-labelledby="${id}-${activeFacet}">
              <div class="facet-heading">
                <h3 class="type-heading">${facetLabels[activeFacet]}</h3>
                <button type="button" class="text-btn type-body" aria-label="Clear ${facetLabels[activeFacet]} filters"
                  data-action="clear-facet" ${counts[activeFacet] ? '' : 'hidden'}>Clear</button>
              </div>
              <div class="facet-options">${facetOptions()}</div>
            </section>
          </div>
        </div>`;
      const count = matches(draft).length;
      footer.innerHTML = `<button type="button" class="action strong type-button" data-action="apply">
        View ${count} ${count === 1 ? 'product' : 'products'}
      </button><div class="sr" role="status" aria-live="polite">${itemCount(count)} match these filters.</div>`;
    }
    function drawFilterAt({field,group,value,resetPanel = false} = {}) {
      const panelTop = body.querySelector('.facet-panel').scrollTop;
      const railTop = body.querySelector('.facet-rail').scrollTop;
      drawFilter();
      body.querySelector('.facet-rail').scrollTop = railTop;
      body.querySelector('.facet-panel').scrollTop = resetPanel ? 0 : panelTop;
      const option = field && [...body.querySelectorAll('input[data-field]')].find(input =>
        input.dataset.field === field && input.dataset.group === group && input.value === value
      );
      const tab = body.querySelector('[aria-selected="true"]');
      (option || tab).focus({preventScroll:true});
      if (resetPanel) tab.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    function clearFacet(key) {
      if (key === 'colour') {
        draft.colours = [];
        for (const type of Object.keys(draft.rules)) draft.rules[type] = [];
      } else if (key === 'category') {
        draft.rules = {};
        draft.category = null;
      } else if (key === 'gender') {
        draft.genderSet = false;
        setGender(draft,'Boys');
      } else {
        draft[key] = initial()[key];
      }
      normalise(draft);
    }
    function setFacet(input) {
      const field = input.dataset.field;
      const {group} = input.dataset;
      const {checked,value} = input;
      const key = field.slice(6);
      if (key === 'colour' && group) draft.rules[group] = toggleValue(draft.rules[group],value,checked);
      else if (key === 'colour') draft.colours = toggleValue(draft.colours,value,checked);
      else if (key === 'category') {
        if (draft.category) {
          draft.rules[draft.category] ??= [];
          draft.category = null;
        }
        if (checked) draft.rules[value] = [];
        else delete draft.rules[value];
      } else if (key === 'gender') {
        setGender(draft,value);
        draft.genderSet = true;
      } else if (key === 'age' || key === 'price') draft[key] = Number(value);
      else if (key === 'pack' || key === 'newIn') draft[key] = checked;
      else draft[key] = toggleValue(draft[key],value,checked);
      normalise(draft);
      drawFilterAt({field,group,value});
    }
    function renderRecommendation(product) {

    function bagLines(removable) {

    function drawTray() {

      if (filtering) return drawFilter();

      if (sorting) {
        body.innerHTML = `<fieldset class="sort-list"><legend class="sr">Sort options</legend>${Object.entries(sorts).map(([key,label]) =>
          `<label class="check-label type-body"><input type="radio" name="sort-${placement}" data-field="sort" value="${key}" ${draft.sort === key ? 'checked' : ''}>${label}</label>`).join('')}</fieldset>`;
      } else {
        const gender = fieldset('Who are you shopping for?',
          choiceGroup(choices([['Boys','Boys'],['Girls','Girls']],'gender',draft.gender)),'1');
        const uniform = fieldset('Choose uniform and colours',

        <button type="button" class="action strong type-button" data-action="apply" ${ready ? '' : 'disabled'}>${finder ? 'Find my uniform' : sorting ? 'Apply sort' : 'Show ' + itemCount(n)}</button>`;

    function redrawAt(control) {

      }
      if (kind === 'filter') activeFacet = 'colour';

        control.setAttribute('aria-label',`Added ${product.name} to bag`);
        control.textContent = 'Added';
        get('[data-rec-status]').textContent = `${product.name} added. ${itemCount(bagCount())} in bag.`;
        return;
      }
      if (currentTray === 'bag' && action === 'remove-bag') {
        bag.delete(value);
        syncBag();
        drawBag();
        get('.close').focus();
        return;
      }
      if (action === 'apply') {
        const keepPosition = currentTray === 'finder' && inlinePlacement;
        const scrollTop = scroll.scrollTop;
        state = normalise(candidate());
        render(true);
        const editButton = keepPosition ? summary.querySelector('[data-action="finder"]') : null;
        close(true,editButton);
        if (keepPosition) scroll.scrollTop = scrollTop;
        return;
      }
      if (currentTray === 'filter') {
        if (action === 'facet') activeFacet = value;
        if (action === 'clear-facet') clearFacet(activeFacet);
        if (action === 'clear-filter-all') draft = reset(draft);
        drawFilterAt({resetPanel:action === 'facet'});
        return;
      }
      if (action === 'gender') setGender(draft,value);
      if (action === 'age') draft.age = Number(value) || null;
      if (action === 'example') {
        setGender(draft,'Boys');
        draft.age = 9;
        draft.rules = {...exampleRules};
        drawTray();
        footer.querySelector('[data-action="apply"]').focus({preventScroll:true});
        return;
      }
      redrawAt(control);
    }
    variant.addEventListener('click',event => {
      const control = event.target.closest('[data-action]');
      if (!control) return;
      if (currentTray) return onTrayClick(control);
      const {action,value} = control.dataset;
      if (['finder','filter','sort','bag'].includes(action)) return open(action,control);
      if (action === 'add-to-bag') {
        const tile = control.closest('[data-quick-buy]');
        const product = products.find(item => item.id === tile.dataset.quickBuy);
        const size = Number(tile.querySelector('select').value);
        if (!showQuickBuy() || !product || !fitsSize(product,size)) return;
        lastAdded = addBagItem(product,size);
        return open('added',control);
      }
      if (action === 'category') state.category = state.category === value ? null : value;
      if (action === 'favourite') {
        if (favourites.has(value)) favourites.delete(value);
        else favourites.add(value);
        const saved = favourites.has(value);
        control.setAttribute('aria-pressed',pressed(saved));
        control.innerHTML = icon(saved ? 'saved' : 'favourite');
        return;
      }
      if (action === 'clear-all') state = reset(state);
      if (action === 'clear-finder') {
        state = {...state,active:false,genderSet:false,age:null,rules:{},category:null};
        setGender(state,'Boys');
      }
      if (action === 'remove') {
        if (value.startsWith('rule-')) {
          const type = value.slice(5);
          delete state.rules[type];
          if (state.category === type) state.category = null;
        } else if (value === 'gender') {
          state.genderSet = false;
          setGender(state,'Boys');
        } else if (value.includes(':')) {
          const [key,selection] = value.split(':');
          state[key] = state[key].filter(v => v !== selection);
        } else state[value] = ['pack','newIn'].includes(value) ? false : null;
        normalise(state);
      }
      render(true);
      const replacement = value ? variant.querySelector(`[data-action="${action}"][data-value="${value}"]`) : null;
      if (replacement) replacement.focus({preventScroll:true});
      else if (action === 'clear-finder' && inlinePlacement) feature.querySelector('button').focus({preventScroll:true});
      else get('[data-action="filter"]').focus({preventScroll:true});
    });
    variant.addEventListener('change',event => {
      const control = event.target;
      const {field} = control.dataset;
      if (!currentTray && field === 'tile-size') {
        const tile = control.closest('[data-quick-buy]');
        tileSizes.set(tile.dataset.quickBuy,Number(control.value) || '');
        syncTileBuy(tile);
        return;
      }
      if (!currentTray) return;
      if (!field) return;
      if (field.startsWith('facet-')) return setFacet(control);
      if (field === 'sort') draft.sort = control.value;
      if (field.startsWith('rule-')) {
        const type = field.slice(5);
        if (control.checked) draft.rules[type] = [];
        else delete draft.rules[type];
      }
      if (field.startsWith('colour-') && control.value !== 'multiple') {
        draft.rules[field.slice(7)] = control.value ? [control.value] : [];
      }
      if (draft.category && Object.keys(draft.rules).length && !Object.hasOwn(draft.rules,draft.category)) draft.category = null;
      redrawAt(control);
    });
    variant.addEventListener('keydown',event => {
      if (!currentTray) return;
      if (event.key === 'Escape') {
        event.preventDefault();
        close();
      }
      if (currentTray === 'filter' && event.target.getAttribute('role') === 'tab') {
        const index = facetKeys.indexOf(activeFacet);
        const next = {ArrowUp:(index + facetKeys.length - 1) % facetKeys.length,
          ArrowDown:(index + 1) % facetKeys.length,Home:0,End:facetKeys.length - 1}[event.key];
        if (next !== undefined) {
          event.preventDefault();
          activeFacet = facetKeys[next];
          drawFilterAt({resetPanel:true});
        }
      }
      if (event.key === 'Tab') {
        const tabbable = [...tray.querySelectorAll('button:not(:disabled),select:not(:disabled),input:not(:disabled)')]
          .filter(el => !el.closest('[hidden]') && el.tabIndex >= 0);
        const end = event.shiftKey ? tabbable[0] : tabbable.at(-1);
        if (document.activeElement === end) {
          event.preventDefault();
          (event.shiftKey ? tabbable.at(-1) : tabbable[0]).focus();
        }
      }
    });
    render();
    return () => renderGrid(matches(state));
  }
  const variants = [...root.querySelectorAll('[data-placement]')];
  const renderTileVariants = variants.map(init);
  const comparison = root.querySelector('.tile-comparison');
  comparison.addEventListener('click',event => {
    const button = event.target.closest('[data-tile-mode]');
    if (!button) return;
    const next = button.dataset.tileMode === 'quick';
    if (quickBuyEnabled === next) return;
    quickBuyEnabled = next;
    comparison.querySelectorAll('button').forEach(option => {
      option.setAttribute('aria-pressed',String(option === button));
    });
    renderTileVariants.forEach(render => render());
  });
  if (root.dataset.standalone !== undefined) {
    const switcher = root.querySelector('.outer-switch');
    switcher.hidden = false;
    switcher.addEventListener('click',event => {
      const button = event.target.closest('[data-show]');
      if (!button) return;
      variants.forEach(variant => variant.hidden = variant.dataset.placement !== button.dataset.show);
      switcher.querySelectorAll('button').forEach(tab => tab.setAttribute('aria-pressed',String(tab === button)));
    });
  }
})();

</script>
</body></html>
